name: Build Shakin Agent APK

on:
  push:
    branches: [main]
    paths:
      - 'phone-agent/android-agent/**'
      - '.github/workflows/shakin-agent-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: phone-agent/android-agent
        run: gradle assembleDebug --no-daemon
      - name: Publish APK
        run: |
          mkdir -p phone-agent/releases
          cp phone-agent/android-agent/app/build/outputs/apk/debug/app-debug.apk phone-agent/releases/shakin-agent-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phone-agent/releases/shakin-agent-debug.apk
          git diff --cached --quiet || git commit -m "build: publish Shakin Agent APK"
          git push
