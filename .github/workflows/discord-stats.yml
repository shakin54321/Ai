name: CHITCHAT Discord Stats

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Discord member and online counters
        env:
          STATS_SECRET: ${{ secrets.DISCORD_SETUP_SECRET }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${STATS_SECRET}" \
            "https://shakin-whatsapp-bridge-shakin1.vercel.app/api/discord/stats"
